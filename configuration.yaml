# Hemma - configuration.yaml reference
# ============================================================================
# If you installed the Hemma integration, you need only the `packages:` and
# `frontend: themes:` lines below. Hemma builds the dashboard itself and
# registers its own resources, so the `lovelace:` block at the end is not for
# you: it belongs to the hand-written YAML setup in docs/ADVANCED.md.
# ============================================================================

homeassistant:
  packages: !include_dir_named packages

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include sensors.yaml

# Hand-written YAML only. Delete this block if the integration is installed:
# Hemma registers the dashboard itself, and serving it twice conflicts.
lovelace:
  mode: storage
  dashboards:
    dashboard-hemma:
      mode: yaml
      title: "Hemma"
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/hemma/hemma.yaml
    dashboard-hemma-mobile:
      mode: yaml
      title: "Hemma Mobile"
      icon: mdi:cellphone
      show_in_sidebar: false
      filename: dashboards/hemma/hemma_mobile.yaml
