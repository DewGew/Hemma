# Opens the Hemma config panel for the view you are looking at. Its own control
# in its own slot - it used to share hemma_menu_icon, which cost the dashboard
# its sidebar hamburger. `shown` comes from hemma_ui_managed, a variable only the
# config panel writes, so a YAML dashboard never renders one.
hemma_settings_button:
  show_icon: false

  variables:
    shown: false

  tap_action:
    action: javascript
    javascript: |
      [[[
        const OPEN = 'hemma-settings-menu';
        const gone = document.querySelector('.' + OPEN);
        if (gone) { if (gone._close) gone._close(); return; }

        const host = this;
        const lift = function (on) {
          if (on) {
            host.style.setProperty('--hemma-settings-fill', '#fff');
            host.style.setProperty('--hemma-settings-ink', '#1c1c20');
          } else {
            host.style.removeProperty('--hemma-settings-fill');
            host.style.removeProperty('--hemma-settings-ink');
          }
        };
        lift(true);

        const card = host.shadowRoot && host.shadowRoot.querySelector('ha-card');
        const r = (card || host).getBoundingClientRect();

        // document.body, or button-card's .ellipsis wrapper clips it.
        const menu = document.createElement('div');
        menu.className = OPEN;
        menu.setAttribute('role', 'menu');
        Object.assign(menu.style, {
          // No minimum. 178px was set when this menu held more than one thing;
          // with a single 14px label in it, the floor was 40px of empty space
          // to the right of the only row.
          position: 'fixed', zIndex: '99999', padding: '6px',
          borderRadius: '20px', boxSizing: 'border-box',
          background: 'rgba(255,255,255,0.16)',
          backdropFilter: 'blur(40px) saturate(170%)',
          WebkitBackdropFilter: 'blur(40px) saturate(170%)',
          boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.26),'
            + ' inset 0 -1px 0 rgba(255,255,255,0.10),'
            + ' 0 12px 34px rgba(0,0,0,0.22)',
          opacity: '0', transform: 'scale(.94)', transformOrigin: 'top right',
          transition: 'opacity .14s ease, transform .16s cubic-bezier(.2,.9,.3,1)'
        });

        const item = document.createElement('button');
        item.type = 'button';
        item.setAttribute('role', 'menuitem');
        item.textContent = 'Edit dashboard';
        Object.assign(item.style, {
          display: 'block', width: '100%', textAlign: 'left', border: '0',
          background: 'transparent', color: '#fff', font: 'inherit',
          fontSize: '14px', fontWeight: '500', letterSpacing: '-0.01em',
          lineHeight: '1.35', padding: '9px 13px', borderRadius: '14px',
          cursor: 'default', outline: 'none'
        });
        const lit = function (on) {
          item.style.background = on ? 'rgba(255,255,255,0.18)' : 'transparent';
        };
        item.onmouseenter = function () { lit(true); };
        item.onmouseleave = function () { lit(false); };
        item.onfocus = function () { lit(true); };
        item.onblur = function () { lit(false); };
        menu.appendChild(item);
        document.body.appendChild(menu);

        const w = menu.offsetWidth;
        menu.style.top = Math.round(r.bottom + 8) + 'px';
        menu.style.left = Math.round(Math.max(12, Math.min(r.right - w, window.innerWidth - w - 12))) + 'px';
        requestAnimationFrame(function () {
          menu.style.opacity = '1';
          menu.style.transform = 'scale(1)';
        });

        const onKey = function (e) { if (e.key === 'Escape') menu._close(); };
        const onAway = function (e) {
          const t = e.composedPath ? e.composedPath()[0] : e.target;
          if (!menu.contains(t)) menu._close();
        };
        menu._close = function () {
          lift(false);
          window.removeEventListener('keydown', onKey, true);
          document.removeEventListener('pointerdown', onAway, true);
          window.removeEventListener('scroll', menu._close, true);
          window.removeEventListener('resize', menu._close);
          menu.style.opacity = '0';
          menu.style.transform = 'scale(.96)';
          setTimeout(function () { if (menu.parentNode) menu.remove(); }, 170);
        };

        item.onclick = function () {
          menu._close();
          const seg = (window.location.pathname || '').split('/').filter(Boolean);
          const view = seg.length > 1 ? seg[1] : '';
          // Must match PANEL_URL in custom_components/hemma/const.py
          window.location.assign('/hemma-studio' + (view ? '/' + view : ''));
        };

        setTimeout(function () {
          window.addEventListener('keydown', onKey, true);
          document.addEventListener('pointerdown', onAway, true);
          window.addEventListener('scroll', menu._close, true);
          window.addEventListener('resize', menu._close);
        }, 0);
      ]]]

  hold_action: { action: none }
  double_tap_action: { action: none }

  custom_fields:
    glyph: >
      [[[
        return `
          <svg class="hemma-settings" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="5"  cy="12" r="2.1"></circle>
            <circle cx="12" cy="12" r="2.1"></circle>
            <circle cx="19" cy="12" r="2.1"></circle>
          </svg>
        `;
      ]]]

  styles:
    card:
      # Defaults to none, so a dashboard the panel does not manage shows nothing
      # even if the slot itself is somehow rendered.
      - --hemma-settings-vis: '[[[ return variables.shown ? "grid" : "none" ]]]'
      - padding: 0
      - background: transparent
      - box-shadow: none !important
      - border: none !important
      - cursor: pointer
    custom_fields:
      glyph:
        - display: grid
        - place-items: center
        - line-height: 0

  extra_styles: |
    :host{
      display: grid !important;
      place-items: center !important;
      width: var(--hemma-chrome-btn-size, 34px) !important;
      height: var(--hemma-chrome-btn-size, 34px) !important;
      color: #fff !important;
      pointer-events: auto !important;
    }

    /* MUST match .np-head-wave in hemma_now_playing_header exactly: same size,
       same flat fill, blur but no rim. --hemma-settings-fill is set while the
       menu is open, so the button inverts the way the waveform does. */
    :host ha-card{
      /* The var is set by styles.card, which lands on ha-card - so it has to be
         read here. Reading it from :host always fell back to none, because a
         custom property set on a child is invisible to its parent. */
      display: var(--hemma-settings-vis, none) !important;
      position: relative !important;
      width: var(--hemma-chrome-btn-size, 34px) !important;
      height: var(--hemma-chrome-btn-size, 34px) !important;
      border-radius: 50% !important;
      place-items: center !important;
      background: var(--hemma-settings-fill, var(--hemma-chrome-fill, rgba(0,0,0,0.40))) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      transition: background 180ms cubic-bezier(.32,.72,0,1) !important;
    }

    /* button-card wraps custom fields in .vertical > .ellipsis, and .ellipsis is
       bottom-aligned AND clips - it was cutting the top pixel off the glyph. */
    :host .vertical,
    :host .ellipsis,
    :host .custom-field,
    :host .custom-field-glyph{ overflow: visible !important; }

    :host .hemma-settings{
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 14px !important;
      height: 14px !important;
      display: block !important;
      fill: var(--hemma-settings-ink, #fff) !important;
      pointer-events: none !important;
      transition: fill 180ms cubic-bezier(.32,.72,0,1) !important;
    }

    @media (hover: hover) and (pointer: fine){
      :host ha-card:hover{
        background: var(--hemma-settings-fill, var(--hemma-chrome-fill-hover, rgba(0,0,0,0.55))) !important;
      }
    }
