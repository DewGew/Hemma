hemma_popup_recently_added:
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: Recently Added
      dismissable: true
      dismiss_on_background: true
      popup_styles:
      - style: all
        styles: |
          /* No pane. Movies and TV Shows are two objects, so they stand on the
             blurred room as two cards rather than as two headings inside one. */
          --hemma-popup-tint: transparent;
          /* The sheet is as wide as its shelves. Two shelves of two tiles make
             a sheet two tiles wide, centered - not a sheet built for three with
             the block sitting in the left of it. The close control and the
             centered title belong to the sheet, so all of it moves together.
             Below the two-column breakpoint the shelves go fluid, so the sheet
             takes the full width instead. */
          --popup-min-width: fit-content;
          --popup-min-width-narrow: min(1260px, 94vw);
          --popup-max-width: min(1260px, 94vw);
          --hemma-popup-gutter-wide: 36px;
          /* The close control's box starts at the bar's padding and the
             content starts at its own gutter; they line up only when the
             two are the same number. */
          /* The popups have no pane, so headings and captions sit straight
             on the room. 6px is enough behind a panel and not enough behind
             bare text - this is scoped to the pane-less popups rather than
             raised globally, so the cover and lock sheets keep the lighter
             scrim they are built against. */
          --hemma-popup-scrim-backdrop: blur(22px) saturate(1.5);
          --hemma-popup-backdrop: none;
          --hemma-popup-shadow: none;
          /* Removed, not hidden: at opacity 0 the blend layer is invisible
             and costs the same as a visible one. */
          --hemma-popup-grain-content: none;
          --hemma-popup-grain: 0;
          --hemma-popup-grain-dark: 0;
          --hemma-popup-scrim: rgba(0, 0, 0, 0.26);
          --hemma-popup-plate-enter:
            hemma-plate-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          @media (prefers-reduced-motion: reduce) {
            --hemma-popup-plate-enter: none;
          }
          --hemma-popup-row-radius: 26px;
          --hemma-popup-plate-backdrop: blur(24px) saturate(180%);
          --hemma-popup-row-fill: rgba(12, 14, 19, 0.62);
          --hemma-popup-chart-fill: rgba(10, 12, 16, 0.68);
          --hemma-card-hover-filter: none;
          --hemma-hover-filter: none;
          --hemma-card-hover-shadow: none;
          --hemma-popup-plate-shadow:
            0 18px 40px -22px rgba(0, 0, 0, 0.50),
            0 2px 8px -5px rgba(0, 0, 0, 0.28);
          --hemma-popup-grabber: transparent;

          /* The chrome arrives with the first plate instead of being there
             on frame one while everything under it fades in. */
          --hemma-popup-chrome-enter:
            hemma-popup-chrome-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          .content { animation: none; }
          /* The title lives in the bar now, centered and level with the
             close control, so it is no longer hidden. */
          .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
          .header-close {
            border-radius: 50%;
            background: var(--hemma-popup-row-fill, rgba(255, 255, 255, 0.10));
            backdrop-filter: var(--hemma-popup-plate-backdrop, none);
            -webkit-backdrop-filter: var(--hemma-popup-plate-backdrop, none);
            box-shadow: var(--hemma-popup-plate-shadow, none);
          }
          ha-adaptive-dialog, ha-dialog, wa-drawer {
            --ha-card-backdrop-filter: none;
            --ha-card-background: transparent;
            --card-background-color: transparent;
            --ha-card-box-shadow: none;
            --ha-card-border-width: 0px;
          }
          /* Without this the content card sizes to its content and sits left,
             so a widened surface leaves all the slack on the right. */
          .content .container > * {
            width: 100% !important;
            max-width: none !important;
            box-sizing: border-box !important;
          }
          /* The card's own padding is forced to 0 by extra_styles, so the
             bottom inset has to come from the container. */
          .content .container {
            padding-bottom: 38px !important;
          }
      content: |
        [[[
          const moviesData = states['sensor.recently_added_movies']?.attributes?.data;
          const tvData     = states['sensor.recently_added_tv']?.attributes?.data;

          const rawM = Array.isArray(moviesData) ? moviesData.slice(1).filter(i => i && i.title) : [];
          const rawT = Array.isArray(tvData)     ? tvData.slice(1).filter(i => i && i.title)     : [];
          const cutoff = Date.now() - 3 * 24 * 60 * 60 * 1000;
          const items = [
            ...rawM.map(i => Object.assign({}, i, {_isTV: false})),
            ...rawT.map(i => Object.assign({}, i, {_isTV: true})),
          ].filter(i => i.airdate && new Date(i.airdate).getTime() >= cutoff)
           .sort((a, b) => new Date(b.airdate || 0) - new Date(a.airdate || 0));
          const N = items.length;

          /* helpers */
          const esc = s => String(s ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

          const resolveUrl = raw => {
            if (!raw) return '';
            const s = String(raw);
            return s.startsWith('/') ? location.origin + s : s;
          };

          const ago = iso => {
            if (!iso) return '';
            const ms = Date.now() - new Date(iso).getTime();
            const h  = ms / 3600000;
            const d  = ms / 86400000;
            if (h < 1)  return 'just now';
            if (h < 24) return Math.floor(h) + 'h ago';
            if (d < 7)  return Math.floor(d) + 'd ago';
            return Math.floor(d / 7) + 'w ago';
          };

          /* empty state */
          if (N === 0) {
            const noHoverStyle = [
              ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
              'ha-card { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }',
              'ha-card:hover { box-shadow: none !important; border-color: transparent !important; }',
              'ha-ripple { display: none !important; }',
            ].join('\n');

            const emptyBadge = {
              type: 'custom:button-card',
              name: 'Up to date',
              tap_action: { action: 'none' },
              show_icon: false, show_name: true, show_label: false, show_state: false,
              card_mod: {
                style: [
                  ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
                  'ha-card { border: none !important; border-radius: 999px !important; padding: 11px 16px !important; backdrop-filter: var(--hemma-glass-pill-backdrop, none) !important; -webkit-backdrop-filter: var(--hemma-glass-pill-backdrop, none) !important; box-shadow: inset 0 1px 0.5px -0.5px var(--pill-glow-top-tight), inset 0 -1px 0.5px -0.5px var(--pill-glow-bottom-tight), inset 0 3px 6px -3px var(--pill-glow-top-soft), inset 0 -3px 6px -3px var(--pill-glow-bottom-soft), inset 0 0 0 999px rgba(255,255,255,0) !important; cursor: default !important; position: relative !important; overflow: visible !important; transition: box-shadow 0.2s ease !important; --pill-glow-top-tight: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-top-tight,0.30) * 100%), transparent) !important; --pill-glow-top-soft: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-top-soft,0.10) * 100%), transparent) !important; --pill-glow-bottom-tight: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-bottom-tight,0.20) * 100%), transparent) !important; --pill-glow-bottom-soft: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-bottom-soft,0.06) * 100%), transparent) !important; }',
                  'ha-card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: conic-gradient(from 0deg, transparent 0deg 50deg, rgba(0,0,0,0.32) 80deg 100deg, transparent 130deg 230deg, rgba(0,0,0,0.32) 260deg 280deg, transparent 310deg 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; pointer-events: none; }',
                  '@media (hover: hover) { :host(:hover) ha-card { box-shadow: inset 0 1px 0.5px -0.5px var(--pill-glow-top-tight), inset 0 -1px 0.5px -0.5px var(--pill-glow-bottom-tight), inset 0 3px 6px -3px var(--pill-glow-top-soft), inset 0 -3px 6px -3px var(--pill-glow-bottom-soft), inset 0 0 0 999px rgba(255,255,255,0.10) !important; } }',
                  'ha-ripple { display: none !important; }',
                ].join('\n'),
              },
              styles: {
                card: [
                  { background: 'var(--hemma-glass-pill-fill,rgba(255,255,255,0.12))' },
                  { '--pill-accent': 'var(--hemma-popup-green-color,#30D158)' },
                  { border: 'none' },
                ],
                name: [
                  { 'font-size': '13px' }, { 'font-weight': '600' }, { 'letter-spacing': '0.01em' },
                  { color: '#ffffff' },
                  { 'white-space': 'nowrap' }, { 'font-family': 'var(--primary-font-family,system-ui)' },
                ],
              },
            };

            const emptyHeader = {
              type: 'custom:button-card',
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: noHoverStyle },
              styles: {
                card: [{ background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' }, { padding: '28px 28px 0 28px' }],
                grid: [{ 'grid-template-areas': '"title badge"' }, { 'grid-template-columns': '1fr auto' }, { 'align-items': 'flex-start' }],
                custom_fields: {
                  title: [{ 'justify-self': 'start' }, { 'text-align': 'left' }],
                  badge: [{ 'justify-self': 'end' }, { 'align-self': 'flex-start' }],
                },
              },
              custom_fields: {
                title: '<div style="font-family:var(--primary-font-family,system-ui);color:var(--hemma-popup-tiles-text-primary);">'
                  + '</div>',
                badge: { card: emptyBadge },
              },
            };

            const emptyAdvice = {
              type: 'custom:button-card',
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: noHoverStyle },
              styles: {
                card: [{ background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' }, { padding: '20px 28px 18px 28px' }],
                grid: [{ 'grid-template-areas': '"body"' }, { 'grid-template-columns': '1fr' }],
                custom_fields: { body: [{ 'justify-self': 'stretch' }, { width: '100%' }, { 'text-align': 'left' }] },
              },
              custom_fields: {
                body: '<div style="font-family:var(--primary-font-family,system-ui);">'
                  + '<div style="font-size:22px;color:var(--primary-text-color,#ffffff);font-weight:400;letter-spacing:-.5px;">Nothing recently added</div>'
                  + '</div>',
              },
            };

            return { type: 'vertical-stack', cards: [emptyHeader, emptyAdvice] };
          }

          /* responsive layout */
          const isMobile     = window.innerWidth < 600;
          const slideH       = isMobile ? 420 : 330;
          const swipeH       = slideH + 14;

          /* shared extra_styles for transparent button-cards */
          const transparentStyles = 'ha-card{'
            + 'background:transparent!important;'
            + 'border:none!important;'
            + 'box-shadow:none!important;'
            + '-webkit-backdrop-filter:none!important;'
            + 'backdrop-filter:none!important;'
            // The theme sets will-change: filter, transform on every ha-card,
            // which makes every backdrop-filter inside it inert - the shelves
            // ask for frost and this wrapper is what would take it away.
            + 'will-change:auto!important;'
            + 'padding:0!important;'
            + 'border-radius:0!important;'
            // visible, or this wrapper clips the shelves' plate shadows square.
            + 'overflow:visible!important;'
            + 'cursor:default!important;'
            + '}'
            + '#container{padding:0!important;height:100%!important;}'
            + 'ha-ripple{display:none!important;}';


          /* slide cards */
          /* A shelf, not a carousel: Recently Added answers "what is new", and a
             row of artwork answers it at a glance. The slideshow hid every item
             but one behind a swipe. */
          /* Two shelves, split by type: the row heading carries what a badge
             used to, which frees the caption pill for the thing you actually
             want - the year on a film, the episode on a show. */
          /* Two landscape rows. Fanart, then three lines: when it landed, what
             it is, and what it is about. Falls back to the poster if the feed
             carries no fanart. */
          const UI = window._hemmaUI;
          if (UI) {
            const clean = (t) => String(t || '').replace(/\s+/g, ' ').trim();

            // default on, so an existing dashboard keeps the marker
            const showWatched = variables.show_watched !== false;
            /* The art carries everything now, so the fields are the two rows
               that sit on it. `aired` is Plex's originallyAvailableAt - the
               ORIGINAL release date - which is a different field from `airdate`,
               the moment it landed in the library. The year comes off the former.
               `rating` arrives pre-formatted as a starred number; under the Plex
               Movie agent it is the Rotten Tomatoes critic score, and it is an
               empty string when Plex has none, which the layout survives. */
            const toCard = (item) => ({
              image: resolveUrl(item.fanart || item.art || item.poster),
              rating: clean(item.rating) || null,
              // Films only: a show's year is the show's, not the episode's, and
              // the second row already carries the episode it belongs to.
              year: item._isTV ? null
                : ((String(item.aired || '').match(/^(\d{4})/) || [])[1] || null),
              // A show leads with its show name; a film with its own.
              title: clean(item.title),
              // Films: the genres. Shows: the episode, numbered.
              line2: item._isTV
                ? (function () {
                    const show = clean(item.title);
                    const ep = clean(item.episode);
                    const num = clean(item.number);
                    const named = ep && (!show || show.toLowerCase() !== ep.toLowerCase());
                    if (num && named) return num + ' \u00b7 ' + ep;
                    return num || (named ? ep : null);
                  })()
                : (clean(item.genres) || null),
              watched: showWatched && (item.flag === false || item.flag === 'false'),
              // Only the detail shows these: the tile has room for two lines
              // and the summary is what you open the detail to read.
              summary: clean(item.summary) || null,
              runtime: item.runtime ? item.runtime + ' min' : null,
              added: ago(item.airdate),
            });

            /* Three each, newest first - the row is a snapshot of what just
               landed, not the whole library. */
            const movies = items.filter(i => !i._isTV).slice(0, 3).map(toCard);
            const shows  = items.filter(i =>  i._isTV).slice(0, 3).map(toCard);

            const areas = [], fields = {}, fstyle = {};
            const add = (name, html) => {
              areas.push('"' + name + '"');
              fields[name] = html;
              fstyle[name] = [{ 'justify-self': 'stretch' }];
            };
            /* One stagger sequence across both shelves: each row spends a
               slot on its heading, then one per cell. */
            let seq = 0;
            /* One tile per item, not one plate per section. Movies and TV Shows
               are headings over a set of objects; the objects are the items, and
               each one carries its own art and caption on one surface. */
            const addRow = (name, list, label) => {
              add(name, UI.mediaRow(list, label, { index: seq, tiles: true }));
              fstyle[name].push({ overflow: 'visible' });
              seq += list.length + 1;
            };
            if (movies.length) addRow('movies', movies, 'Movies');
            if (shows.length)  addRow('shows',  shows,  'TV Shows');

            /* This config is baked when the tile renders, so the fanart can be
               fetched on idle long before the popup is opened. */
            if (UI.prime) UI.prime(movies.concat(shows).map(c => c.image));

            const uiCard = {
              type: 'custom:button-card',
              // Transparent, or this nested ha-card lays a second
              // backdrop-filter over the popup's own and the block it
              // covers reads a shade off from everything around it.
              card_mod: { style: transparentStyles },
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              extra_styles: transparentStyles,
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  // No horizontal padding: mediaRow lays its own 26px gutter, and
                  // two gutters put the tiles 52px in while the close control sat
                  // at 26. One gutter, one left edge.
                  { padding: '16px 0 20px 0' }, { 'border-radius': '0' },
                ],
                grid: [
                  { 'grid-template-areas': areas.join(' ') },
                  { 'grid-template-columns': '1fr' },
                  { 'row-gap': '20px' },
                ],
                custom_fields: fstyle,
              },
              custom_fields: fields,
            };
            return { type: 'vertical-stack', cards: [uiCard] };
          }

        ]]]
