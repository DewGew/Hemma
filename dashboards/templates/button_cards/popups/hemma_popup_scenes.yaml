hemma_popup_scenes:
  template:
  - hemma_popup_base
  - hemma_scene_core
  variables:
    room_name: Home
    scenes: null
    scene_exclude: null
    scene_order: null
    scene_icons: {}
    scene_transition: 4
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    hemma_popup:
      title: Scenes
      dismissable: true
      style: '--popup-min-width: min(880px, 92vw); --popup-max-width: min(880px, 92vw);'
      dismiss_on_background: true
      popup_styles:
      - style: all
        styles: |
          /* No pane. The header sits on the room and each section stands in
             front of it as its own card, the way iOS groups settings on a
             background rather than inside one box. The room is still blurred,
             by the scrim, which is a sibling of the surface and so survives
             the pane going transparent. */
          --hemma-popup-tint: transparent;
          /* The close control's box starts at the bar's padding and the
             content starts at its own gutter; they line up only when the
             two are the same number. */
            --hemma-popup-gutter-wide: 28px;
          /* The popups have no pane, so headings and captions sit straight
             on the room. 6px is enough behind a panel and not enough behind
             bare text - this is scoped to the pane-less popups rather than
             raised globally, so the cover and lock sheets keep the lighter
             scrim they are built against. */
          --hemma-popup-scrim-backdrop: blur(22px) saturate(1.5);
          --hemma-popup-backdrop: none;
          --hemma-popup-shadow: none;
          /* The grain is two pseudo-elements on .glass, blending overlay and
             screen. They keep painting after the tint goes transparent, and a
             screen blend over noise is exactly the pale panel that survived
             the first attempt. */
          /* Removed, not hidden: at opacity 0 the blend layer is invisible
             and costs the same as a visible one. */
          --hemma-popup-grain-content: none;
          --hemma-popup-grain: 0;
          --hemma-popup-grain-dark: 0;
          --hemma-popup-scrim: rgba(0, 0, 0, 0.26);

          /* No chart to wait for. */
          --hemma-popup-plate-enter:
            hemma-plate-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          @media (prefers-reduced-motion: reduce) {
            --hemma-popup-plate-enter: none;
          }

          --hemma-popup-hero-label-size: 15px;
          --hemma-popup-row-radius: 26px;
          /* Frosted, not opaque. The pane's blur used to sit under these, and
             .content still nulls --ha-card-backdrop-filter for every card in
             the popup, so the frost has to be asked for here. The fills drop
             to let it read. */
          /* The theme lifts every ha-card with filter: brightness(1.01) on
             hover. A filter on an ancestor makes every descendant's
             backdrop-filter inert, so hovering the empty space around a
             widget - the wrapper card - knocked the frost out of both of
             them. Killed popup-wide; the plate re-declares its own shadow. */
          --hemma-card-hover-filter: none;
          --hemma-hover-filter: none;
          --hemma-card-hover-shadow: none;

          --hemma-popup-row-pad-x: 26px;
          --hemma-popup-row-pad-y: 15px;
          --hemma-popup-plate-backdrop: blur(24px) saturate(180%);
          --hemma-popup-chart-fill: rgba(10, 12, 16, 0.68);
          --hemma-popup-row-fill: rgba(12, 14, 19, 0.62);
          /* Lifted, not slabbed: one wide soft pass carries the height, one
             short contact pass keeps the edge from dissolving into the room. */
          --hemma-popup-plate-shadow:
            0 18px 40px -22px rgba(0, 0, 0, 0.50),
            0 2px 8px -5px rgba(0, 0, 0, 0.28);

          /* visionOS puts nothing bare on the room: the only chrome outside a
             window is its close control, and that control is itself a glass
             object. The title was printed twice - here and in the widget
             eight pixels below - so it goes, clipped rather than removed so a
             screen reader still gets it. */
          /* The sheet's drag handle keeps working; only the little bar
             that advertises it goes. Nothing else on these popups is a hint. */
          --hemma-popup-grabber: transparent;

          /* The chrome arrives with the first plate instead of being there
             on frame one while everything under it fades in. */
          --hemma-popup-chrome-enter:
            hemma-popup-chrome-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          .content { animation: none; }
          /* The title lives in the bar now, centered and level with the
             close control, so it is no longer hidden. */
          .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
          /* 48px is left alone: the base sizes it so the glyph's ink lands on
             the same left margin as the widgets below. */
          .header-close {
            border-radius: 50%;
            background: var(--hemma-popup-row-fill, rgba(255, 255, 255, 0.10));
            backdrop-filter: var(--hemma-popup-plate-backdrop, none);
            -webkit-backdrop-filter: var(--hemma-popup-plate-backdrop, none);
            box-shadow: var(--hemma-popup-plate-shadow, none);
          }

          ha-adaptive-dialog, ha-dialog, wa-drawer {
            --ha-card-backdrop-filter: none;
            --ha-card-background: transparent;
            --card-background-color: transparent;
            --ha-card-box-shadow: none;
            --ha-card-border-width: 0px;
          }
          .content .container > * {
            width: 100% !important;
            max-width: none !important;
            box-sizing: border-box !important;
          }
          .content .container {
            scrollbar-width: none;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding-bottom: 24px !important;
          }
          .content .container::-webkit-scrollbar {
           display: none;
          }
          /* The popup element reads these; the wa-dialog rule was for the
             dialog this popup no longer uses. */
          --popup-min-width: min(880px, 92vw);
          --popup-max-width: min(880px, 92vw);
      content: |
        [[[
          const _hassObj = typeof hass !== 'undefined' ? hass : null;
          const _SC = window._hemmaSC;

          const sceneIds = _SC ? _SC.list(states, _hassObj, variables) : [];
          if (_SC) _SC.prefetch(sceneIds, states);

          const roomName = variables.room_name || 'Home';
          const trans    = Number(variables.scene_transition ?? 4);
          const anchorId = entity?.entity_id || sceneIds[0] || null;
          const _idsJson = JSON.stringify(sceneIds);

          const _lastSnip = ''
            + 'var _ids = ' + _idsJson + ';'
            + 'var _act = window._hemmaSC ? window._hemmaSC.activeList(_ids, states) : [];'
            + 'var _best = _act[0] || null;';

          const _lc = {
            onBg:    'rgba(255,255,255,0.94)',
            onName:  'rgba(0,0,0,0.85)',
            offBg:   'rgba(255,255,255,0.11)',
            offName: 'rgba(255,255,255,0.90)',
          };

          const wrapperStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; overflow: visible !important; }',
            'ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: default !important; overflow: visible !important; }',
            'ha-card:hover { box-shadow: none !important; }',
            // The theme sets will-change: filter, transform on every ha-card,
            // and that makes every backdrop-filter inside it inert - so the
            // frost is asked for and has nothing to sample.
            'ha-card { will-change: auto !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n') + '\n@media (max-width: 600px) { ha-card { padding-left: 14px !important; padding-right: 14px !important; } }';

          /* Header */
          const headerCard = {
            type: 'custom:button-card',
            entity: anchorId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: wrapperStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '28px 28px 0 28px' },
              ],
              grid: [
                { 'grid-template-areas': '"title"' },
                { 'grid-template-columns': '1fr' },
                { 'align-items': 'flex-start' },
              ],
              custom_fields: { title: [{ 'justify-self': 'start' }, { 'text-align': 'left' }] },
            },
            custom_fields: {
              title: '<div style="font-family:var(--primary-font-family,system-ui);color:var(--hemma-popup-tiles-text-primary,#ffffff);text-align:left;">'
                + '</div>',
            },
          };

          /* Current scene line */
          const adviceCard = {
            type: 'custom:button-card',
            entity: anchorId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: wrapperStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '20px 28px 18px 28px' },
              ],
              grid: [{ 'grid-template-areas': '"body"' }, { 'grid-template-columns': '1fr' }],
              custom_fields: { body: [{ 'justify-self': 'stretch' }, { width: '100%' }, { 'text-align': 'left' }] },
            },
            custom_fields: {
              body: `[[[
                ${_lastSnip}
                var _label = _best
                  ? (states[_best]?.attributes?.friendly_name || _best.replace('scene.', '').replace(/_/g, ' '))
                  : 'No scene applied';
                if (_act.length > 1) _label += ' +' + (_act.length - 1);
                return '<div style="font-family:var(--primary-font-family,system-ui);">'
                  + '<div style="font-size:22px;color:var(--primary-text-color,#ffffff);font-weight:400;letter-spacing:-.5px;">' + _label + '</div>'
                  + '</div>';
              ]]]`,
            },
          };

          /* Scene tiles */
          const sceneIconMap = variables.scene_icons || {};

          const makeSceneCard = (sceneId) => _SC.chip(sceneId, {
            icon: sceneIconMap[sceneId] || null,
            transition: trans,
          });

          if (!sceneIds.length) {
            const emptyCard = {
              type: 'custom:button-card',
              entity: anchorId,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: wrapperStyle },
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  { padding: '4px 28px 24px 28px' },
                ],
                grid: [{ 'grid-template-areas': '"body"' }, { 'grid-template-columns': '1fr' }],
                custom_fields: { body: [{ 'justify-self': 'stretch' }, { 'text-align': 'left' }] },
              },
              custom_fields: {
                body: '<div style="font-family:var(--primary-font-family,system-ui);font-size:14px;color:var(--hemma-popup-tiles-text-secondary,rgba(255,255,255,0.75));line-height:1.45;">'
                  + 'No scenes found. Hemma lists every scene in the entity registry that is not hidden or disabled, so check Settings &rsaquo; Devices &amp; Services &rsaquo; Entities if you expected some here.'
                  + '</div>',
              },
            };
            return { type: 'vertical-stack', cards: [headerCard, emptyCard] };
          }

          const C = window.matchMedia('(max-width:767px),(max-height:600px)').matches ? 2 : 4;
          const tileCF = {}, tileFS = {};
          sceneIds.forEach((id, i) => {
            tileCF['sc' + i] = { card: makeSceneCard(id) };
            tileFS['sc' + i] = [{ 'justify-self': 'stretch' }, { 'text-align': 'left' }];
          });

          let phIdx = 0;
          let areas = '';
          const rowCount = Math.ceil(sceneIds.length / C);
          for (let r = 0; r < rowCount; r++) {
            let row = '';
            for (let c = 0; c < C; c++) {
              const idx = r * C + c;
              if (c > 0) row += ' ';
              if (idx < sceneIds.length) {
                row += 'sc' + idx;
              } else {
                const ph = 'scph' + phIdx++;
                tileCF[ph] = '';
                tileFS[ph] = [{ height: '0' }, { padding: '0' }, { margin: '0' }];
                row += ph;
              }
            }
            areas += '"' + row + '" ';
          }

          const tilesCard = {
            type: 'custom:button-card',
            entity: anchorId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: wrapperStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '4px 28px 24px 28px' },
              ],
              grid: [
                { 'grid-template-areas': areas.trim() },
                { 'grid-template-columns': 'repeat(' + C + ', minmax(0,1fr))' },
                { gap: '10px' },
                { 'align-items': 'start' },
              ],
              custom_fields: tileFS,
            },
            custom_fields: tileCF,
          };

          return { type: 'vertical-stack', cards: [headerCard, adviceCard, tilesCard] };
        ]]]
  icon_tap_action:
    haptic: light
    action: more-info
