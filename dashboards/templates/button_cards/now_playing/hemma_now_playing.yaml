        custom_fields:
          s1:
            card:
              type: custom:button-card
              template: hemma_now_playing_primary
              variables:
                slot_id: >
                  [[[ return (window._hemmaNPCfgKey
                    ? window._hemmaNPCfgKey(variables) : '') + '|np1'; ]]]
