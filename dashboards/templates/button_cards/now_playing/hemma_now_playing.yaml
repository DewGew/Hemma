              # The wrapper contains the whole tile, pseudos included.
              - opacity: 'var(--np-slot-has, 0)'
              - transition: 'max-height 0s calc((1 - var(--np-slot-has, 0)) * 0.5s), opacity 0s calc((1 - var(--np-slot-has, 0)) * 0.5s)'
              - overflow: visible
              - width: 100%
            s7:
              # An empty slot must take no room, but it has to keep its height
              # while its tile animates away - so the collapse is instant on
              # arrival and waits out the exit on departure. Same idiom the
              # shell uses for --np-min.
              - --np-slot-has: '[[[ return (variables.settled || [])[6] ? 1 : 0; ]]]'
              - max-height: 'calc(var(--np-slot-has, 0) * 900px)'
              # The tile's own guard cannot do this: --np-has-src is declared in
              # styles.card, which button-card applies to ha-card, and the glass
              # rim is :host::after - an ANCESTOR of ha-card. A custom property
