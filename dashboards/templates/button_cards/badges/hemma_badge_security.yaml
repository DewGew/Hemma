hemma_badge_security:
  template: [hemma_badge_base]

  show_state: false
  show_label: false
  show_icon: true

  variables:
    enabled: true
    label: null
    icon_size: null

  tap_action:
    action: more-info
  hold_action:
    action: more-info
  double_tap_action:
    action: none

  # Carrier only - extra_styles hides #icon and masks the real glyph onto #img-cell::before.
  icon: mdi:lock

  styles:
    card:
      - display: >
          [[[
            const v = variables?.enabled;
            const enabled = (v === undefined || v === null) ? true :
              (typeof v === 'boolean') ? v :
              (typeof v === 'number') ? v !== 0 :
              !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
            const st = String(entity?.state ?? '').trim().toLowerCase();
            const dead = !entity?.entity_id || !st || ['unknown','unavailable'].includes(st);
            return (!enabled || dead) ? 'none' : 'inline-grid';
          ]]]
      - --hemma-badge-icon-color: var(--hemma-badge-security-color, #00c3d0)
      - --icon-primary-color: var(--hemma-badge-icon-color)
      - --paper-item-icon-color: var(--hemma-badge-icon-color)
      - --state-icon-color: var(--hemma-badge-icon-color)

    icon:
      - color: var(--hemma-badge-icon-color)

  name: >
    [[[
      const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
      const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split('{' + p + '}').join(String(v[p])); return s; });
      const esc = (t) => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      const id  = String(entity?.entity_id || '');
      const dom = id.split('.')[0];
      const s   = String(entity?.state || '').toLowerCase();
      const dc  = String(entity?.attributes?.device_class || '').toLowerCase();

      const title = variables?.label || entity?.attributes?.friendly_name || T('filter.security', 'Security');

      let sub = '';
      if (dom === 'lock') {
        sub = s === 'locked' ? L('component.lock.entity_component._.state.locked', 'Locked') : s === 'unlocked' ? L('component.lock.entity_component._.state.unlocked', 'Unlocked') : L('component.lock.entity_component._.state.jammed', 'Jammed');
      } else if (dom === 'alarm_control_panel') {
        sub = s === 'disarmed' ? L('component.alarm_control_panel.entity_component._.state.disarmed', 'Disarmed')
            : s === 'triggered' ? L('component.alarm_control_panel.entity_component._.state.triggered', 'Triggered')
            : s === 'armed_home' ? L('component.alarm_control_panel.entity_component._.state.armed_home', 'Armed Home')
            : s === 'armed_away' ? L('component.alarm_control_panel.entity_component._.state.armed_away', 'Armed Away')
            : T('security.armed', 'Armed');
      } else if (dom === 'camera') {
        /* "Idle" is every camera, all day, so it says nothing. Fall through to the
           same alert wording the aggregated camera badge uses. */
        const alert = window.hemmaCameraAlert
          ? window.hemmaCameraAlert(hass, states, [id], variables?.alert_window_minutes) : '';
        sub = s === 'recording' ? L('component.camera.entity_component._.state.recording', 'Recording')
            : s === 'streaming' ? T('security.live', 'Live')
            : (alert || T('security.no_alerts', 'No Alerts'));
      } else if (dom === 'cover') {
        sub = s === 'closed' ? L('component.cover.entity_component._.state.closed', 'Closed') : L('component.cover.entity_component._.state.open', 'Open');
      } else if (dc === 'motion') {
        sub = s === 'on' ? T('motion.title', 'Motion') : L('component.binary_sensor.entity_component.motion.state.off', 'Clear');
      } else {
        sub = s === 'on' ? T('security.open', 'Open') : T('security.closed', 'Closed');
      }

      return `
        <div class="badge-wrap">
          <div class="badge-title">${esc(title)}</div>
          <div class="badge-sub">${esc(sub)}</div>
        </div>
      `;
    ]]]

  extra_styles: >
    [[[
      const v = variables?.enabled;
      const enabled = (v === undefined || v === null) ? true :
        (typeof v === 'boolean') ? v :
        (typeof v === 'number') ? v !== 0 :
        !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
      const st = String(entity?.state ?? '').trim().toLowerCase();
      const dead = !entity?.entity_id || !st || ['unknown','unavailable'].includes(st);

      const dom = String(entity?.entity_id || '').split('.')[0];
      const dc = String(entity?.attributes?.device_class || '').toLowerCase();
      const isDoor = dc === 'door' || dc === 'opening';
      let name = 'lock';
      if (dom === 'camera') name = 'doorbell';
      else if (dom === 'lock') name = st === 'locked' ? 'lock-fill' : 'lock-open-fill';
      else if (dom === 'binary_sensor' || dom === 'cover') {
        const open = st === 'on' || st === 'open';
        name = isDoor ? (open ? 'door-open' : 'door-closed') : (open ? 'lock-open' : 'lock');
      }
      const URL = window.hemmaIconUrl(name);
      const RAW = variables?.icon_size || '72%';
      const SIZE = (isDoor && dom !== 'lock' && /%\s*$/.test(RAW))
        ? (parseFloat(RAW) * 0.944).toFixed(1) + '%'
        : RAW;

      return `:host{display:${(!enabled || dead) ? 'none' : 'inline-block'} !important;}
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-badge-icon-color, var(--hemma-badge-security-color, #00c3d0)) !important;
          -webkit-mask: url('${URL}') no-repeat center / auto ${SIZE};
          mask: url('${URL}') no-repeat center / auto ${SIZE};
          transform: translateZ(0);
        }`;
    ]]]
